[workspace]
authors = ["Vernonicuhhh <Vernonicuhhh@protonmail.com>"]
channels = ["https://prefix.dev/robostack-humble", "https://prefix.dev/conda-forge"]
name = "ros2_ws"
# glibc: every container here is Ubuntu 22.04 (glibc 2.35); pixi assumes 2.28 otherwise. 2.34 is
# needed by libudev1 >= 260, which RoboStack's librealsense2 build for this lock requires.
platforms = [
  { name = "linux-64-cuda", platform = "linux-64", cuda = "13", glibc = "2.34" },
  { name = "linux-aarch64-glibc234", platform = "linux-aarch64", glibc = "2.34" },
]
version = "0.1.0"

# The default environment remains the NVIDIA desktop environment used on Linux.
[feature.linux-cuda]
platforms = ["linux-64-cuda"]

[feature.linux-cuda.tasks]
build = { cmd = "colcon build --parallel-workers $(nproc) --symlink-install --event-handlers console_direct+ --base-paths src --cmake-args ' -DCMAKE_BUILD_TYPE=Release' ' -DCMAKE_LIBRARY_PATH=/usr/local/cuda/lib64/stubs' ' -DCMAKE_CXX_FLAGS=\"-Wl,--allow-shlib-undefined\"'", depends-on = ["submodules"] }

[feature.linux-cuda.dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
colcon-common-extensions = "*"
flake8-docstrings = "*"
pytest-cov = "*"
ros-humble-turtlesim = ">=1.4.3,<2"

[feature.linux-cuda.pypi-dependencies]
# blink(1) USB LED driver for the mode light (src/status_light); pulls hidapi (prebuilt wheels).
blink1 = ">=1.1,<2"
argcomplete = "*"
numpy = "*"
empy = "*"
lark = "*"

# CPU-only aarch64 environment for the NVIDIA Jetson (L4T / JetPack) rover (`l4t`, see
# .devcontainer/l4t/). The Jetson's CUDA comes from its image, not from pixi.
[feature.aarch64-cpu]
platforms = ["linux-aarch64-glibc234"]

[feature.aarch64-cpu.tasks]
build = { cmd = "colcon build --parallel-workers $(nproc) --symlink-install --event-handlers console_direct+ --base-paths src --cmake-args ' -DCMAKE_BUILD_TYPE=Release'", depends-on = ["submodules"] }

[feature.aarch64-cpu.dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
colcon-common-extensions = "*"
flake8-docstrings = "*"
pytest-cov = "*"
ros-humble-turtlesim = ">=1.4.3,<2"

[feature.aarch64-cpu.pypi-dependencies]
# blink(1) USB LED driver for the mode light (src/status_light); pulls hidapi (prebuilt wheels).
blink1 = ">=1.1,<2"
argcomplete = "*"
numpy = "*"
empy = "*"
lark = "*"

[environments]
default = { features = ["linux-cuda"]}
l4t = { features = ["aarch64-cpu"]}

[dependencies]
ros-humble-xacro = "*"
ros-humble-joint-state-publisher-gui = ">=2.4.0,<3"
ros-humble-robot-state-publisher = ">=3.0.3,<4"
ros-humble-ament-cmake-auto = ">=1.3.14,<2"
compilers = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
cmake = "<4"
ninja = ">=1.13.2,<2"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-humble-ros-gz = ">=0.244.24,<0.245"
ros-humble-controller-manager = ">=2.54.0,<3"
ros-humble-ros2-controllers = ">=2.53.1,<3"
ros-humble-gz-ros2-control = ">=0.7.19,<0.8"
ruff = ">=0.16.2,<0.17"
ros-humble-ros2-control = ">=2.54.0,<3"
ros-humble-ign-ros2-control = ">=0.7.19,<0.8"
# Foxglove WebSocket bridge: rover publishes on :8765, ground station connects with Foxglove Studio.
ros-humble-foxglove-bridge = "*"
# Keyboard teleop — the drive path where no /dev/input gamepad exists (CI, headless).
ros-humble-teleop-twist-keyboard = "*"
ros-humble-navigation2 = ">=1.1.20,<2"
ros-humble-nav2-bringup = ">=1.1.20,<2"
ros-humble-robot-localization = ">=3.5.4,<4"
# Keeps ROS on the lock's RoboStack build (0.9 = build 18, Python 3.12). Without it, adding any
# package lets the solver move all of ROS to a newer build (Python 3.14) in the same `pixi lock`.
ros2-distro-mutex = "0.9.*"
# Intel RealSense D435i on the arm's end effector (perception/arm_vision, docs/arm-camera.md).
# realsense2_camera is the ROS driver; it pulls in librealsense, the SDK (with pyrealsense2 and the
# rs-enumerate-devices / rs-fw-update tools). 4.57.7 is the newest release built for RoboStack
# build 18: a newer one needs a newer ros2-distro-mutex, i.e. all of ROS upgraded.
ros-humble-realsense2-camera = "4.57.7.*"
ros-humble-realsense2-description = "4.57.7.*"
# conda-forge builds librealsense with FORCE_RSUSB_BACKEND (libusb, no kernel patches: what Intel
# recommends on a Jetson). The CPU build everywhere: its CUDA builds need CUDA >= 12.9, newer than
# JetPack 6's 12.6, and CUDA only speeds up colour conversion / alignment, which 640x480 doesn't need.
# py312: each build bundles pyrealsense2 for one Python, and the builds don't declare which, so the
# solver would otherwise pick a py314 one for this Python 3.12 environment.
librealsense = { version = "2.57.7.*", build = "cpu_py312*" }
# compressed / compressedDepth image_transport plugins: the RealSense topics reach the ground
# station as JPEG / PNG instead of raw images. cv_bridge: arm_vision's ArUco node.
ros-humble-image-transport-plugins = "*"
ros-humble-cv-bridge = "*"

[activation]
# Pixi has already activated the selected environment (default or l4t).  Source only this workspace's overlay so we do not re-source the
# underlay captured when another architecture built install/setup.sh.
scripts = ["install/local_setup.sh", "dds_env.sh"]

# Same ROS 2 domain on every machine (Jetson `l4t`, ground station `default`) so a
# ground-station teleop node and the Jetson's diff_drive_controller share one DDS graph.
# Standardise on one value; change it if it clashes on a shared LAN / at a competition.
# Only applies through `pixi run` / `pixi shell` — a raw shell must export it itself.
[activation.env]
ROS_DOMAIN_ID = "42"

[tasks]
fmt = "ruff check src/ --fix"
# Runs before every `pixi run build`: roboclaw_hardware_interface (and so pxx, the arm) builds the
# vendored third_party/JetsonGPIO submodule, which a clone without --recursive doesn't have. A
# no-op (no network) once it's checked out; offline and missing, it warns and the build reports it.
submodules = "git -C .. submodule update --init third_party/JetsonGPIO || echo 'pixi: could not fetch third_party/JetsonGPIO (offline?): git submodule update --init third_party/JetsonGPIO'"
