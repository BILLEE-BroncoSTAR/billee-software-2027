joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

joy_drive:
  ros__parameters:
    # Which control scheme to run: "arcade" or "tank". Switching is a yaml edit
    # and a relaunch - both schemes live in the same node.
    #   arcade  left stick steers, RT drives forward, LT reverses
    #   tank    left stick drives the left track, right stick the right track
    scheme: arcade

    # Xbox and PlayStation pads share these indices through joy_node on Linux.
    # Verify with:  ros2 topic echo /joy   while moving each control.
    # (If you run game_controller_node instead: triggers are axes 4/5, RB is button 10.)
    deadman_button: 5          # RB (Xbox) / R1 (PS) - hold to move; release = stop
    speed_scale: 2.0           # m/s at full throttle (both schemes)

    # --- arcade ---
    steer_axis: 0              # left stick X  (push right -> turn right)
    steer_scale: 1.5           # rad/s at full stick
    invert_steer: false        # set true if your pad reports stick-right as +1
    throttle_axis: 5           # RT / R2  (analog) - forward
    reverse_axis: 2            # LT / L2  (analog) - reverse
    trigger_rest: 1.0          # /joy axis value with the trigger released
    trigger_press: -1.0        # /joy axis value with the trigger fully pressed

    # --- tank ---
    left_axis: 1               # left stick Y  - left track
    right_axis: 4              # right stick Y - right track
    track_width: 0.67          # m between the tracks; measure it on the rover,
                               # it sets how much stick difference is how many rad/s
