controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time: true

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - joint_wheel_l1
      - joint_wheel_l2
      - joint_wheel_l3
    right_wheel_names:
      - joint_wheel_r1
      - joint_wheel_r2
      - joint_wheel_r3

    wheel_separation: 0.67   # track width
    # Skid-steer slip: in Gazebo (wheel mu 0.2) wheel odometry over-reports turns.
    # At 1.0 it reported ~208 deg for a ~92 deg ground-truth turn; at 2.26 it
    # under-reported (~80% of truth, since the multiplier also changes the commanded
    # wheel speeds and therefore the slip). 1.85 is interpolated between the two.
    # Sim-calibrated only: real.launch.py resets this to 1.0 until it is measured on
    # real terrain.
    wheel_separation_multiplier: 1.85
    wheel_radius: 0.11

    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: false # must disable to use robot_localization package

    publish_rate: 50.0
    use_stamped_vel: false
    cmd_vel_timeout: 0.25

    # Defaults are all zero, which robot_localization treats as near-certain and lets
    # wheel odometry override every other source. Skid steering slips on turns, so yaw
    # (pose) gets the loosest value. Order: x, y, z, roll, pitch, yaw.
    # Yaw rate is 0.01: with the 1.85 multiplier, sim turns read within ~2% of ground
    # truth, and the earlier 0.05 made the global EKF lag and overshoot turns by 7-13 deg.
    pose_covariance_diagonal: [0.05, 0.05, 1000000.0, 1000000.0, 1000000.0, 0.2]
    twist_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.01]