# node_map.yaml — canonical CAN node ID <-> arm joint assignment.
#
# Single source of truth for "which P17/P20 drives which arm joint". The
# per-joint <param name="node_id"> / <param name="gear_ratio"> in the URDF
# <ros2_control> block are hand-transcribed from this file — keep them in sync.
#
# TODO: fill in from the arm wiring once joint names exist in robot_description.
# node_id: CANopen node ID, 1-127 (stored on the drive in 2001h:01).
# gear_ratio: motor-shaft turns per joint turn (1.0 if the motor's reported
# position is already at the output shaft — the drive has its own 6091h gear
# ratio object; check whether it already scales 6064h).

nodes:
  - joint: joint_arm_1      # TODO
    motor: p20
    node_id: 1
    gear_ratio: 1.0
  - joint: joint_arm_2      # TODO
    motor: p17
    node_id: 2
    gear_ratio: 1.0
