### ekf local filter file ###
ekf_filter_node_odom:
    ros__parameters:
        frequency: 30.0

        # Planar rover: nothing measures z/roll/pitch (VIO and wheel odom both report
        # 1e6 variance for them, and there is no IMU).
        two_d_mode: true
        publish_acceleration: true
        publish_tf: true
        # Publishes filter health on /diagnostics (for Foxglove / rqt_runtime_monitor)
        print_diagnostics: true

# 1. Set the map_frame, odom_frame, and base_link frames to the appropriate frame names for your system.
#     1a. If your system does not have a map_frame, just remove it, and make sure "world_frame" is set to the value of odom_frame.
# 2. If you are fusing continuous position data such as wheel encoder odometry, visual odometry, or IMU data, set "world_frame"
#    to your odom_frame value. This is the default behavior for robot_localization's state estimation nodes.
# 3. If you are fusing global absolute position data that is subject to discrete jumps (e.g., GPS or position updates from landmark
#    observations) then:
#     3a. Set your "world_frame" to your map_frame value
#     3b. MAKE SURE something else is generating the odom->base_link transform. Note that this can even be another state estimation node
#         from robot_localization! However, that instance should *not* fuse the global data.
        map_frame: map              # Defaults to "map" if unspecified
        odom_frame: odom            # Defaults to "odom" if unspecified
        # base_footprint is the URDF root. It can't be base_link: robot_state_publisher already
        # publishes base_footprint -> base_link, and a TF frame can have only one parent.
        base_link_frame: base_footprint
        world_frame: odom           # Defaults to the value of odom_frame if unspecified

        #odom 0 = wheel odometry velocities only; VIO is the single absolute pose source,
        #since two disagreeing absolute poses make the filter jump between them.
        #vy is fused too (unlike ekf_real.yaml): diff_drive_controller always reports vy = 0
        #with the controllers.yaml covariance (0.01), a non-holonomic constraint that was part
        #of the A/B-tested configuration.
        odom0: /diff_drive_controller/odom
        odom0_config: [false, false, false,
                      false, false, false,
                      true,  true,  false,
                      false, false, true,
                      false, false, false]

        #odom 1 = visual odometry: pose only (x, y, yaw). Its z/roll/pitch carry 1e6 variance
        #and two_d_mode drops them anyway.
        odom1: /depth_cam/vio/odom
        odom1_config: [true,  true,  false,  # X, Y, Z
                    false, false, true,  # Roll, Pitch, Yaw
                    false, false, false, # Vx, Vy, Vz
                    false, false, false,  # Vroll, Vpitch, Vyaw
                    false, false, false] # Ax, Ay, Az

        odom1_differential: false
        odom1_relative: true
        odom1_queue_size: 2

### ekf configuration for the global EKF filter ###
ekf_filter_node_map:
    ros__parameters:
        frequency: 30.0

        two_d_mode: true
        publish_acceleration: true
        publish_tf: true
        print_diagnostics: true

        #Same as the local EKF filter, except the world frame is set to the map frame
        #global pushes map -> odom, ensuring that the local EKF filter can continue to provide smooth odometry updates
        map_frame: map
        odom_frame: odom
        base_link_frame: base_footprint
        world_frame: map

        #odom 0 = GPS odometry
        odom0: /odometry/gps
        odom0_config: [true,  true,  false,  # x, y, z
                    false, false, false,  # roll, pitch, yaw
                    false, false, false,  # linear velocity
                    false, false, false,  # angular velocity
                    false, false, false] # acceleration

        odom0_differential: false
        odom0_relative: false
        odom0_queue_size: 2

        #odom 1 = wheel odometry velocities
        #initializes the filter before GPS arrives (navsat needs /odometry/global to start) and supplies yaw rate.
        #There is no IMU on the rover.
        odom1: /diff_drive_controller/odom
        odom1_config: [false, false, false,  # x, y, z
                    false, false, false,  # roll, pitch, yaw
                    true,  true,  false,  # vx, vy, vz
                    false, false, true,   # vroll, vpitch, vyaw
                    false, false, false] # ax, ay, az
        odom1_differential: false
        odom1_relative: false
        odom1_queue_size: 2

### Navsat configuration ###
#converts coordinates to map frame odometry, and the global estimate back to the gps
navsat_transform_node:
    ros__parameters:
        frequency: 30.0
        # wait for the global EKF to publish before computing the GPS -> map transform
        delay: 3.0
        # matches the 2D global filter
        zero_altitude: true
        # No IMU or compass: heading comes from /odometry/global, whose yaw is relative to
        # startup. navsat treats yaw 0 as east, so this is only correct if the rover starts
        # facing east (true in sim, where it spawns facing east). On the real rover any other
        # start heading rotates the GPS points in the map frame until a heading-init step
        # (e.g. heading from GPS while driving straight) is added.
        use_odometry_yaw: true
        publish_filtered_gps: true
