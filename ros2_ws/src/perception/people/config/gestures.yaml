# gesture_node: which command each gesture publishes on /people/gesture (field `command`).
# The commands are placeholders until a node acts on them (e.g. navigation); "" = report only.
gesture_node:
  ros__parameters:
    conf_threshold: 0.2   # OpenPose joint confidence below this counts as "not seen"
    hold_frames: 2        # consecutive skeletons before a gesture (or its end) is reported; ~0.3 s at ~6 Hz
    commands:
      arms_u: stop
      t_pose: come_here
      right_arm_up: follow_me
      left_arm_up: resume
