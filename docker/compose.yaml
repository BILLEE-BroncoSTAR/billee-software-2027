services:
  rover:
    build:
      dockerfile: Dockerfile.l4t-humble
    image: rover-ros-humble:l4t-aarch64
    container_name: rover
    hostname: rover
    user: root

    privileged: true

    # JetPack 6 (Orin): use the nvidia runtime, NOT "--gpus all" (unreliable on JP6,
    # and Orin under JP6 doesn't expose the same GPU device semantics as Thor/JP7 did).
    runtime: nvidia

    network_mode: host
    pid: host
    ipc: host

    environment:
      ROS_DISTRO: humble
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DISPLAY: ${DISPLAY}

    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      # kept only for optional local debugging on a Jetson with a display attached
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../:/workspaces/URC-2027

    stdin_open: true
    tty: true
